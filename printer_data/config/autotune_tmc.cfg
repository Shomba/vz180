# ======================================================================
# Klipper TMC Autotune - Usongshine 17HS8401SE (VZ180 AWD CoreXY)
# ======================================================================
# Datasheet Usongshine 17HS8401 / 17HS8401S / 17HS8401SE (NEMA17 48mm):
# - Angulo de passo: 1.8° (200 passos/rev)
# - Corrente nominal: 1.7 A (1.7A - 1.8A)
# - Resistencia de fase: 1.8 Ohm
# - Indutancia de fase: 3.2 mH (0.0032 H)
# - Torque de retencao: 52 N.cm (0.52 N.m)

[motor_constants usongshine-17hs8401se]
resistance: 1.8
inductance: 0.0032
holding_torque: 0.52
max_current: 1.7
steps_per_revolution: 200

[autotune_tmc stepper_x]
motor: usongshine-17hs8401se
tuning_goal: performance
sg4_thrs: 140
voltage: 24

[autotune_tmc stepper_x1]
motor: usongshine-17hs8401se
tuning_goal: performance
sg4_thrs: 140
voltage: 24

[autotune_tmc stepper_y]
motor: usongshine-17hs8401se
tuning_goal: performance
sg4_thrs: 120
voltage: 24

[autotune_tmc stepper_y1]
motor: usongshine-17hs8401se
tuning_goal: performance
sg4_thrs: 120
voltage: 24

[autotune_tmc stepper_z]
motor: usongshine-17hs8401se
tuning_goal: auto
voltage: 24

# Caso deseje ativar autotune no extrusor (pancake 36mm), descomente e ajuste o modelo:
# [autotune_tmc extruder]
# motor: ldo-36sth20-1004ahg
# tuning_goal: auto
# voltage: 24

# ======================================================================
# Configuracao e Homing Override para Sensorless Homing AWD (X e Y)
# ======================================================================

[gcode_macro _SENSORLESS_CONFIG]
variable_sgt_x: 180
variable_sgt_y: 120
variable_home_current: 0.80
variable_aux_current: 0.35
gcode:

[homing_override]
axes: xy
gcode:
  {% set cfg = printer['gcode_macro _SENSORLESS_CONFIG'] %}
  {% set sgt_x = cfg.sgt_x|int %}
  {% set sgt_y = cfg.sgt_y|int %}
  {% set cur_home = cfg.home_current|float %}
  {% set cur_sec = cfg.aux_current|float %}
  {% set run_x = printer.configfile.settings['tmc2209 stepper_x'].run_current %}
  {% set run_x1 = printer.configfile.settings['tmc2209 stepper_x1'].run_current %}
  {% set run_y = printer.configfile.settings['tmc2209 stepper_y'].run_current %}
  {% set run_y1 = printer.configfile.settings['tmc2209 stepper_y1'].run_current %}
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  {% if home_all or 'X' in params %}
    SET_TMC_FIELD STEPPER=stepper_x FIELD=tcoolthrs VALUE=1048575
    SET_TMC_FIELD STEPPER=stepper_x FIELD=semin VALUE=0
    SET_TMC_FIELD STEPPER=stepper_x FIELD=sgthrs VALUE={sgt_x}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cur_home}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cur_home}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={cur_sec}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={cur_sec}
    G4 P1000
    G28 X
    G90
    G1 X15 F3000
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={run_x1}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_y}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={run_y1}
  {% endif %}

  {% if home_all or 'Y' in params %}
    SET_TMC_FIELD STEPPER=stepper_y FIELD=tcoolthrs VALUE=1048575
    SET_TMC_FIELD STEPPER=stepper_y FIELD=semin VALUE=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=sgthrs VALUE={sgt_y}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cur_home}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cur_home}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={cur_sec}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={cur_sec}
    G4 P1000
    G28 Y
    G90
    G1 Y15 F3000
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={run_x1}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_y}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={run_y1}
  {% endif %}

  {% if home_all or 'Z' in params %}
    G28 Z
  {% endif %}

# ======================================================================
# Macros de Calibracao Sensorless Homing AWD e Modos TMC Autotune
# ======================================================================

[gcode_macro CALIBRAR_SENSORLESS_X]
description: Testa e ajusta SG4_THRS do eixo X (0 a 255, maior = mais sensivel)
gcode:
  {% set sgt = params.SENSIBILIDADE|default(135)|int %}
  {% set cur_home = params.CORRENTE_HOME|default(0.80)|float %}
  {% set cur_sec = params.CORRENTE_AUX_AWD|default(0.35)|float %}
  SET_GCODE_VARIABLE MACRO=_SENSORLESS_CONFIG VARIABLE=sgt_x VALUE={sgt}
  SET_GCODE_VARIABLE MACRO=_SENSORLESS_CONFIG VARIABLE=home_current VALUE={cur_home}
  SET_GCODE_VARIABLE MACRO=_SENSORLESS_CONFIG VARIABLE=aux_current VALUE={cur_sec}
  RESPOND MSG="Testando Sensorless X com SG4_THRS={sgt} (corrente home={cur_home}A, aux AWD={cur_sec}A)..."
  G28 X
  AUTOTUNE_TMC STEPPER=stepper_x SG4_THRS={sgt}

[gcode_macro CALIBRAR_SENSORLESS_Y]
description: Testa e ajusta SG4_THRS do eixo Y (0 a 255, maior = mais sensivel)
gcode:
  {% set sgt = params.SENSIBILIDADE|default(120)|int %}
  {% set cur_home = params.CORRENTE_HOME|default(0.80)|float %}
  {% set cur_sec = params.CORRENTE_AUX_AWD|default(0.35)|float %}
  SET_GCODE_VARIABLE MACRO=_SENSORLESS_CONFIG VARIABLE=sgt_y VALUE={sgt}
  SET_GCODE_VARIABLE MACRO=_SENSORLESS_CONFIG VARIABLE=home_current VALUE={cur_home}
  SET_GCODE_VARIABLE MACRO=_SENSORLESS_CONFIG VARIABLE=aux_current VALUE={cur_sec}
  RESPOND MSG="Testando Sensorless Y com SG4_THRS={sgt} (corrente home={cur_home}A, aux AWD={cur_sec}A)..."
  G28 Y
  AUTOTUNE_TMC STEPPER=stepper_y SG4_THRS={sgt}

[gcode_macro MODO_SILENCIOSO]
description: Muda os drivers XY AWD para StealthChop (silent) via TMC Autotune
gcode:
  AUTOTUNE_TMC STEPPER=stepper_x TUNING_GOAL=silent
  AUTOTUNE_TMC STEPPER=stepper_x1 TUNING_GOAL=silent
  AUTOTUNE_TMC STEPPER=stepper_y TUNING_GOAL=silent
  AUTOTUNE_TMC STEPPER=stepper_y1 TUNING_GOAL=silent
  RESPOND MSG="TMC Autotune: Motores XY AWD em modo SILENT (StealthChop)."

[gcode_macro MODO_MONSTRO]
description: Muda os drivers XY AWD para SpreadCycle (performance) via TMC Autotune
gcode:
  AUTOTUNE_TMC STEPPER=stepper_x TUNING_GOAL=performance
  AUTOTUNE_TMC STEPPER=stepper_x1 TUNING_GOAL=performance
  AUTOTUNE_TMC STEPPER=stepper_y TUNING_GOAL=performance
  AUTOTUNE_TMC STEPPER=stepper_y1 TUNING_GOAL=performance
  RESPOND MSG="TMC Autotune: Motores XY AWD em modo PERFORMANCE (SpreadCycle)."
