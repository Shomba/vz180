# [pwm_cycle_time beeper]
# pin: v2:PA1
# value: 0
# shutdown_value: 0
# cycle_time: 0.0005

[gcode_macro M300]
description: Emite um bip sonoro com frequencia e duracao
gcode:
    {% set S = params.S|default(2000)|int %}        ; Set frequency (S), default to 2 kHz if omitted or invalid
    {% set P = params.P|default(100)|int %}         ; Set duration (P), default to 100ms if omitted or invalid
    SET_PIN PIN=beeper VALUE=0.05 CYCLE_TIME={ 1.0/S if S > 0 else 1 }       ; Activate the beeper at a 80% duty cycle
    G4 P{P}                                         ; Hold the beep for the specified duration
    SET_PIN PIN=beeper VALUE=0                      ; Turn off the beeper

[gcode_macro M301]
description: Emite um tom sonoro continuo
gcode:
    {% set S = params.S|default(2000)|int %}        ; Set frequency (S), default to 2 kHz if omitted or invalid
    {% set P = params.P|default(100)|int %}         ; Set duration (P), default to 100ms if omitted or invalid
    SET_PIN PIN=beeper VALUE=0.05 CYCLE_TIME={ 1.0/S if S > 0 else 1 }       ; Activate the beeper at a 80% duty cycle
    G4 P{P}                                         ; Hold the beep for the specified duration

[gcode_macro PAUSE_TUNE]
description: Melodia de aviso de pausa da impressao
gcode:
    M300 S784 P300
    M300 S587 P600
    
[gcode_macro END_TUNE]
description: Melodia de conclusao da impressao
gcode:
    M300 S392 P250 
    M300 S494 P250 
    M300 S587 P250 
    M300 S523 P300 

[gcode_macro WEEZER]
description: Riff classico de Buddy Holly (Weezer) otimizado nos 3 eixos XY+Z
gcode:
