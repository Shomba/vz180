    G28
  {% endif %}
  SAVE_GCODE_STATE NAME=weezer_state
  G90
  G1 X90.000 Y87.000 Z25.000 F6000
  _AUDIO_MODE_COMPACTO_ON
  _AUDIO_MODE_Z_ON
  G91
  SET_VELOCITY_LIMIT ACCEL=900
  G1 X1.14101 Y0.00000 Z0.07607 F312.17
  G4 P17
  G1 X-0.95947 Y0.00000 Z-0.06396 F262.50
  G4 P16
  G1 X-1.14101 Y0.00000 Z-0.07607 F312.17
  G4 P17
  G1 X1.28074 Y0.00000 Z0.08538 F350.40
  G4 P16
  G1 X-1.53978 Y0.00000 Z-0.10265 F393.31
  G4 P16
  G1 X1.28074 Y0.00000 Z0.08538 F350.40
  G4 P17
  G1 X-1.14101 Y0.00000 Z-0.07607 F312.17
  G4 P16
  G1 X0.92708 Y0.00000 Z0.06181 F247.77
  G4 P17
  G1 X7.58372 Y2.52791 Z0.50501 F369.69
  SET_VELOCITY_LIMIT ACCEL=60
  G1 Z-0.49490 F150.00
  SET_VELOCITY_LIMIT ACCEL=1500
  G1 X-7.43202 Y-2.52791 F1200.00
  G90
  _AUDIO_MODE_Z_OFF
  _AUDIO_MODE_OFF
  RESTORE_GCODE_STATE NAME=weezer_state

