#####################################################################
# Salvamento e Restauracao Automatica do Z-Offset (Babystepping)
# Utiliza [save_variables] (variables.cfg) sem precisar reiniciar o Klipper
#####################################################################

[delayed_gcode _LOAD_Z_OFFSET]
initial_duration: 1.0
gcode:
  {% set saved = printer.save_variables.variables %}
  {% if 'z_offset' in saved %}
    {% set z_off = saved.z_offset|float %}
    {% if z_off != 0.0 %}
      _SET_GCODE_OFFSET Z={z_off} MOVE=0
      RESPOND TYPE=echo MSG="🔄 Z-Offset restaurado automaticamente: {z_off} mm"
    {% endif %}
  {% endif %}

[delayed_gcode _DELAYED_SAVE_Z_OFFSET]
gcode:
  {% set z_off = printer.gcode_move.homing_origin.z|float|round(4) %}
  SAVE_VARIABLE VARIABLE=z_offset VALUE={z_off}
  RESPOND TYPE=echo MSG="💾 Z-Offset salvo automaticamente: {z_off} mm"

[gcode_macro SET_GCODE_OFFSET]
rename_existing: _SET_GCODE_OFFSET
description: Aplica o offset e agenda salvamento automatico em variables.cfg
gcode:
  _SET_GCODE_OFFSET {rawparams}
  {% if 'Z' in params or 'Z_ADJUST' in params %}
    UPDATE_DELAYED_GCODE ID=_DELAYED_SAVE_Z_OFFSET DURATION=1.0
  {% endif %}

[gcode_macro Z_OFFSET_APPLY_ENDSTOP]
rename_existing: _Z_OFFSET_APPLY_ENDSTOP
description: Aplica o Z-offset no endstop e zera a variavel salva para evitar duplicacao
gcode:
  _Z_OFFSET_APPLY_ENDSTOP {rawparams}
  SAVE_VARIABLE VARIABLE=z_offset VALUE=0.0

[gcode_macro Z_OFFSET_APPLY_PROBE]
rename_existing: _Z_OFFSET_APPLY_PROBE
description: Aplica o Z-offset na probe e zera a variavel salva para evitar duplicacao
gcode:
  _Z_OFFSET_APPLY_PROBE {rawparams}
  SAVE_VARIABLE VARIABLE=z_offset VALUE=0.0
