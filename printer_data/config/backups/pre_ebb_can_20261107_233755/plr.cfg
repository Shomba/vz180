[force_move]
enable_force_move: True

[save_variables]
filename: /home/shoomba/printer_data/config/variables.cfg

[gcode_macro G31]
description: Limpa arquivos temporarios de retomada PLR
gcode:
  RUN_SHELL_COMMAND CMD=clear_plr

[gcode_shell_command clear_plr]
command: sh /home/shoomba/Yumi_PLR/clear_plr.sh
timeout: 5.

[gcode_macro save_last_file]
description: Salva o ultimo arquivo impresso para retomada
gcode:
  {% set filepath = printer.virtual_sdcard.file_path %}
  {% set filename = filepath.split('/')[-1] %}
  {% set fn_lit = '"' ~ (filename | replace('\\', '\\\\') | replace('"', '\\"')) ~ '"' %}
  {% set fp_lit = '"' ~ (filepath | replace('\\', '\\\\') | replace('"', '\\"')) ~ '"' %}
  {% set fn_arg = "'" ~ (fn_lit | replace("'", "'\\''")) ~ "'" %}
  {% set fp_arg = "'" ~ (fp_lit | replace("'", "'\\''")) ~ "'" %}
  SAVE_VARIABLE VARIABLE=last_file VALUE={fn_arg}
  SAVE_VARIABLE VARIABLE=filepath VALUE={fp_arg}
  M118 Last File: {filename}

[gcode_macro clear_last_file]
description: Limpa o ultimo arquivo salvo para retomada
gcode:
  SAVE_VARIABLE VARIABLE=last_file VALUE='""'
  SAVE_VARIABLE VARIABLE=filepath VALUE='""'

[gcode_shell_command POWER_LOSS_RESUME]
command: /home/shoomba/Yumi_PLR/plr.sh
timeout: 420.

[gcode_macro RESUME_INTERRUPTED]
description: Retoma uma impressao interrompida por falta de energia
gcode:
  {% set saved = printer.save_variables.variables %}
  {% set z_height = params.Z_HEIGHT|default(saved.power_resume_z|default(none)) %}
  {% set last_file = params.GCODE_FILE|default(saved.last_file|default(""))|string %}
  {% set clean_file = last_file|replace('"', '') %}
  {% if z_height is none or clean_file|length == 0 %}
    RESPOND TYPE=error MSG="PLR sem dados salvos. Execute uma nova impressao antes de tentar retomar."
  {% else %}
    SET_GCODE_OFFSET Z=0 MOVE=0
    M118 Retomando {clean_file} em Z={z_height}
    RUN_SHELL_COMMAND CMD=POWER_LOSS_RESUME PARAMS="{z_height} \"{clean_file}\""
    SDCARD_PRINT_FILE FILENAME=plr/"{clean_file}"
  {% endif %}

[gcode_macro LOG_Z]
description: Registra o Z atual para o power loss recovery
gcode:
  {% set z_pos = printer.gcode_move.gcode_position.z %}
  RESPOND MSG="Current Z is {z_pos}"
  SAVE_VARIABLE VARIABLE=power_resume_z VALUE={z_pos}
