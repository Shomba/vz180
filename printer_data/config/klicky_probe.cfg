#####################################################################
# Klicky PCB Probe (Montagem Manual / Sem Dock)
# Placa da Cabeça: BTT EBB36 v1.2 (CAN bus)
# Pino de Sinal: PB6 (^ebb:PB6)
# Offsets: X=0, Y=15, Z=6.0
#####################################################################

[probe]
pin: ^ebb:PB6
x_offset: 0.0
y_offset: 15.0
z_offset: 6.0
speed: 5.0
lift_speed: 10.0
samples: 2
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.05
samples_tolerance_retries: 3

#####################################################################
# Macros de Apoio para Klicky Manual
#####################################################################

[gcode_macro ATTACH_PROBE]
description: Move o cabecote para frente para facilitar o encaixe manual da Klicky
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="Fazendo Home inicial dos eixos..."
        G28
    {% endif %}
    G90
    G1 Z60 F3000
    G1 X90 Y10 F6000
    RESPOND TYPE=echo MSG="🧲 Posicionado na frente! Encaixe a probe Klicky no cabecote."
    M117 Encaixe a Klicky

[gcode_macro DETACH_PROBE]
description: Move o cabecote para frente para retirada manual da Klicky
gcode:
    G90
    G1 Z60 F3000
    G1 X90 Y10 F6000
    RESPOND TYPE=echo MSG="✋ Remova a probe Klicky do cabecote antes de iniciar qualquer impressao!"
    M117 Remova a Klicky

[gcode_macro BED_MESH_MANUAL_KLICKY]
description: Rotina guiada de Bed Mesh com colocacao e retirada manual da Klicky
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    ATTACH_PROBE
    RESPOND TYPE=echo MSG="Aguardando montagem... Apos colocar a Klicky, execute BED_MESH_CALIBRATE ou continue."
