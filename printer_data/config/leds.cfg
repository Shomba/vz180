[neopixel leds]
pin: PA8
#   The pin connected to the neopixel. This parameter must be
#   provided.
chain_count: 12
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
color_order: BRG
#   Set the pixel order required by the LED hardware (using a string
#   containing the letters R, G, B, W with W optional). Alternatively,
#   this may be a comma separated list of pixel orders - one for each
#   LED in the chain. The default is GRB.
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 0.0
#initial_WHITE: 0.0
#   See the "led" section for information on these parameters.





[led_effect panel_idle]
autostart:              false
frame_rate:             12
leds:
    neopixel:leds
layers:
    gradient  0.3  1 add (0.8, 0.0, 0.0),(0.0, 0.8, 0.0),(0.0, 0.0, 0.8)

[led_effect progress]
autostart:              false
frame_rate:             12
leds:
    neopixel:leds
layers:
    gradient  0.3  1 add (0.8, 0.0, 0.0),(0.0, 0.8, 0.0),(0.0, 0.0, 0.8)

[led_effect heater]
leds:
    neopixel:leds
autostart:                          false
frame_rate:                         12
heater:                             extruder
recalculate: true
layers:
    heaterfire  50 0 add    (0,0,1),(1,0,0)
    static  0  0 top    (0,0,1)
[led_effect prepare]
leds:
    neopixel:leds
button_pins: ^PC0, ^PC1, ^PC2
autostart: true
recalculate: true
layers:
      pattern 0.4 1 add  (1, 0.2, 0),(1, 0.3, 0),(0.8, 0.3, 0)
    flashbutton 0.05 0.7 top (0,0,1)

[led_effect flash]
leds:
    neopixel:leds
autostart: false
frame_rate:                         12
recalculate: true
layers:
      blink 0.05 0.9 top (1,1,1)
  
[gcode_macro stop_LEDs]
gcode:
  STOP_LED_EFFECTS