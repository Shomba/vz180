# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.
[duplicate_pin_override]
pins:PC0, PC1, PC2
#   A comma separated list of pins that may be used multiple times in
#   a config file without normal error checks. This parameter must be
#   provided.



[include monster_mode.cfg]
#[include silent_mode.cfg]

#[include ebb.cfg]
[include octopus.cfg]
[include mainsail.cfg]
[include macros.cfg]
[include buzer.cfg]
[include accel.cfg]
[include leds.cfg]
[skew_correction]
[include timelapse.cfg]
[include led_progress.cfg]
[virtual_sdcard]
path: ~/printer_data/gcodes

[exclude_object]
[gcode_arcs]
resolution: 1.0
#   An arc will be split into segments. Each segment's length will
#   equal the resolution in mm set above. Lower values will produce a
#   finer arc, but also more work for your machine. Arcs smaller than
#   the configured value will become straight lines. The default is
#   1mm.

[neopixel leds]
pin: PA8
#   The pin connected to the neopixel. This parameter must be
#   provided.
chain_count: 12
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
color_order: BRG
#   Set the pixel order required by the LED hardware (using a string
#   containing the letters R, G, B, W with W optional). Alternatively,
#   this may be a comma separated list of pixel orders - one for each
#   LED in the chain. The default is GRB.
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 0.7
#initial_WHITE: 0.0
#   See the "led" section for information on these parameters.




[stepper_z]
step_pin: octo:PF9
dir_pin: octo:PF10
enable_pin: !octo:PG2
microsteps: 64
rotation_distance: 5.33333
endstop_pin: ^octo:PG12
homing_speed:30
second_homing_speed:3
homing_retract_speed:12
position_min: -1 
#position_endstop: 0.0
position_max: 270


[tmc2209 stepper_z]
uart_pin: octo:PF2
#tx_pin: v2:PC10
uart_address: 1
run_current: 1.0
stealthchop_threshold: 0
interpolate: false

[extruder]
step_pin: octo:PC13
dir_pin: !octo:PF0
enable_pin: !octo:PF1
gear_ratio: 50:10
microsteps: 64
rotation_distance: 22.856
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 1.4
heater_pin: PC8
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
pressure_advance: 0.03
min_extrude_temp: 180
min_temp: 0
max_temp: 290

[tmc2209 extruder]
uart_pin: octo:PE4
# diag_pin: ^v2:PC15
# driver_SGTHRS: 255
uart_address: 0
run_current: 0.650
stealthchop_threshold: 0

# [gcode_button Clog_detect]
# pin: tmc2209_extruder:virtual_endstop
# press_gcode: 
#   G28 z

# [homing_override]
# gcode:
#   G28 XY
#   G28 Z
#   G1
#   G1 Z10
# axes: z
# #   The axes to override. For example, if this is set to "z" then the
# #   override script will only be run when the z axis is homed (eg, via
# #   a "G28" or "G28 Z0" command). Note, the override script should
# #   still home all axes. The default is "xyz" which causes the
# #   override script to be run in place of all G28 commands.
[heater_bed]
heater_pin: PC9
#sensor_type: EPCOS 100K B57560G104F
sensor_type: Generic 3950
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

# [temperature_sensor chamber]
# sensor_type: Generic 3950
# sensor_pin: v2:PA0
# min_temp:-250
# max_temp:100



# [temperature_sensor teste]
