[gcode_arcs]
resolution: 0.1

[stepper_z]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 32
rotation_distance: 5.33333
endstop_pin: ^PG12
homing_speed: 30
second_homing_speed: 10
homing_retract_speed: 12
position_min: -1
position_max: 270

[tmc2208 stepper_z]
uart_pin: PF2
run_current: 1.0
stealthchop_threshold: 0
interpolate: false

[extruder]
step_pin: ebb:PD0
dir_pin: !ebb:PD1
enable_pin: !ebb:PD2
gear_ratio: 50:10
microsteps: 64
rotation_distance: 22.856
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 1.4
heater_pin: ebb:PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: ebb:PA3
smooth_time: 0.1
pressure_advance: 0.03
min_extrude_temp: 20

min_temp: -200
max_temp: 290

[tmc2209 extruder]
uart_pin: ebb:PA15
run_current: 0.85
stealthchop_threshold: 0

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
min_temp: 0
max_temp: 130

# [temperature_sensor chamber]
# sensor_type: Generic 3950
# sensor_pin: PF5
# min_temp: -273.15
# max_temp: 150

[temperature_sensor Stepper]
sensor_type: Generic 3950
sensor_pin: PF6
min_temp: -273.15
max_temp: 150

[temperature_sensor MCU]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: -273.15
max_temp: 150

[temperature_sensor host]
sensor_type: temperature_host
min_temp: -273.15
max_temp: 150

[heater_fan heatbreacooling_fan]
pin: ebb:PA1

[idle_timeout]
timeout: 43200

[fan]
pin: ebb:PA0
kick_start_time: 0.2
max_power: 1
off_below: 0.15
shutdown_speed: 0.0

[delayed_gcode PART_FAN_BOOT_PULSE]
initial_duration: 1.0
gcode:
  M106 S255
  UPDATE_DELAYED_GCODE ID=PART_FAN_BOOT_OFF DURATION=0.25

[delayed_gcode PART_FAN_BOOT_OFF]
gcode:
  M106 S0
  M107

[mcu]
# Octopus em modo USB-CAN bridge (can0)
canbus_uuid: a3feb7b099ac

[bed_mesh]
speed: 120
#   The speed (in mm/s) of non-probing moves during the calibration.
#   The default is 50.
horizontal_move_z: 10
probe_count: 5,5
algorithm: bicubic
fade_start: 0.6
fade_end: 10.0
mesh_min: 10, 15
mesh_max: 170, 165

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 25000
square_corner_velocity: 5.0
max_z_velocity: 80
max_z_accel: 500

##   Following basic configuration is default to most images and don't need
##   to be changed in most scenarios. Only uncomment and change it if your
##   Image differ from standart installations. In most common scenarios
##   a User only need [timelapse] in their configuration.
