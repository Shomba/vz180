#[include monster_mode.cfg]
[include silent_mode.cfg]
[include autotune_tmc.cfg]

[include ebb.cfg]
[include klicky_probe.cfg]
[include plr.cfg]
[include mainsail.cfg]
[include macros.cfg]
[include buzer.cfg]
#[include accel.cfg]  # ADXL agora na EBB36 (ebb.cfg)
[skew_correction]
[include timelapse.cfg]
[include moonraker_obico_macros.cfg]

# LED features disabled. PA8 (Octopus) ficou livre: a part cooling fan
# agora está na EBB36 (ebb:PA0).
[virtual_sdcard]
path: /home/shoomba/printer_data/gcodes

[exclude_object]

[duplicate_pin_override]
pins: PG12

