# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.
[duplicate_pin_override]
pins:PC0, PC1, PC2
#   A comma separated list of pins that may be used multiple times in
#   a config file without normal error checks. This parameter must be
#   provided.


[include mainsail.cfg]
[include macros.cfg]
#[include accel.cfg]
#[include leds.cfg]
[skew_correction]
[include timelapse.cfg]
#[include led_progress.cfg]
[virtual_sdcard]
path: ~/printer_data/gcodes

[exclude_object]


[stepper_x]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 32
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 180
position_min: 0
homing_speed: 100

[stepper_x1]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200

[stepper_y]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 32
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 174
position_min: 0
homing_speed: 100

[stepper_y1]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200

[stepper_z]
step_pin: v2:PB0
dir_pin: v2:PC5
enable_pin: !v2:PB1
microsteps: 16
rotation_distance: 5.33333
endstop_pin: ^PC2
homing_speed:12
second_homing_speed:3
homing_retract_speed:5
position_min: -1 
#position_endstop: 0.0
position_max: 270

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.3
stealthchop_threshold: 0 

[tmc2209 stepper_x1]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 1.5
stealthchop_threshold: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 1.5
stealthchop_threshold: 0

[tmc2209 stepper_y1]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 1.5
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: v2:PC11
tx_pin: v2:PC10
uart_address: 1
run_current: 0.8
stealthchop_threshold: 0 

[extruder]
step_pin: v2:PB3
dir_pin: !v2:PB4
enable_pin: !v2:PD2
gear_ratio: 50:10
microsteps: 16
rotation_distance: 22.856
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 1.4
heater_pin: PC8
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
pressure_advance: 0.03
min_extrude_temp: 180
min_temp: 0
max_temp: 290

[tmc2209 extruder]
uart_pin: v2:PC11
tx_pin: v2:PC10
uart_address: 3
run_current: 0.650
stealthchop_threshold: 0

[heater_bed]
heater_pin: PC9
#sensor_type: EPCOS 100K B57560G104F
sensor_type: Generic 3950
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: v2:PA0
min_temp:-250
max_temp:1000

[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

[fan_generic aux]
pin: v2:PC8
kick_start_time: 0.200

[led teste]
white_pin: v2:PC9


[delayed_gcode STARTUP_MACRO]
gcode:
    G28 X Y
    G1 X5 Y170 F6000
    G28 Z
    G1 Z10
    SET_LED_EFFECT EFFECT=panel_idle REPLACE=1 FADETIME=1.0
    SET_SKEW XY=140.18,140.8,100.4
initial_duration: 1



[gcode_macro START_PRINT]
gcode:
      #Get Printer built volume dimensions
      {% set X_MAX = printer.toolhead.axis_maximum.x|default(100)|float %}
      {% set Y_MAX = printer.toolhead.axis_maximum.y|default(100)|float %}
      {% set Z_MAX = printer.toolhead.axis_maximum.z|default(100)|float %}
    
      #Set pcf speed to 10%
      M106 S26
    
      #Get Bed and Extruder temperature from Slicer GCode
      {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
      {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
      #Preheat nozzle and bed
      M104 S{EXTRUDER_TEMP} T0                        
      M140 S{BED_TEMP}                                

      #Home
      G28

      #Move up to clean bed
      G1 Y{Y_MAX - 30} Z{Z_MAX/7.0} F8000                

      #Heat nozzle and bed
      M190 S{BED_TEMP}                               
      M109 S{EXTRUDER_TEMP} T0


[gcode_macro END_PRINT]
gcode:
        #Get Printer built volume dimensions
        {% set X_MAX = printer.toolhead.axis_maximum.x|default(100)|float %}
        {% set Y_MAX = printer.toolhead.axis_maximum.y|default(100)|float %}

        #Fix-up extruder
        
        G91                                            
        G1 E-2 F2700                                    
        G1 E-1.5 Z0.2 F2400                        
        G1 X5 Y5 F6000                               
        G1 Z10                                 
        G90                                        
        
        #Present print
        G1 Z{printer.toolhead.position.z + 50} F600
        G1 X5 Y170 F6000
        M106 S0                                      
        M104 S0                                       
        M140 S0                                 

        #Disable Steppers
        M84 X Y E

#e3v3
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_530029000250414235363020-if00

#e3v2
[mcu v2]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_32FFD6055646363339680143-if00

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 150000
max_z_velocity: 15
max_z_accel: 100

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>


