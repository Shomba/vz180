[temperature_sensor MCU]
sensor_type: temperature_mcu
sensor_mcu: mcu # or your specific name
min_temp: 0
max_temp: 100



# [temperature_sensor V2]
# sensor_type: temperature_mcu
# sensor_mcu: v2 # or your specific name
# min_temp: 0
# max_temp: 100


[temperature_sensor host]
sensor_type: temperature_host
 # or your specific name
min_temp: 0
max_temp: 100


[heater_fan heatbreacooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

# [fan_generic extruder_partfan]
# pin: v2:PC9

# [led teste]
# white_pin: v2:PC9


[delayed_gcode STARTUP_MACRO]
gcode:
    
   G28 X Y
   G1 X90 Y90 F6000
    #G28 Z
    
    #G1 Z10
    #SET_LED_EFFECT EFFECT=panel_idle REPLACE=1 FADETIME=1.0
    
    #SET_SKEW XY=140.18,140.8,100.4
initial_duration: 1



[gcode_macro START_PRINT]
gcode:
      #Get Printer built volume dimensions
      {% set X_MAX = printer.toolhead.axis_maximum.x|default(100)|float %}
      {% set Y_MAX = printer.toolhead.axis_maximum.y|default(100)|float %}
      {% set Z_MAX = printer.toolhead.axis_maximum.z|default(100)|float %}
    
      #Set pcf speed to 10%
      M106 S26
    
      #Get Bed and Extruder temperature from Slicer GCode
      {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
      {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
      #Preheat nozzle and bed
      M104 S{EXTRUDER_TEMP} T0                        
      M140 S{BED_TEMP}                                

      #Home
      G28

      #Move up to clean bed
      G1 Y{Y_MAX - 30} Z{Z_MAX/7.0} F8000                
      SET_LED LED=leds RED=0.8 GREEN=0.3 BLUE=0
      #Heat nozzle and bed
      M190 S{BED_TEMP}                               
      M109 S{EXTRUDER_TEMP} T0


[gcode_macro END_PRINT]
gcode:
        #Get Printer built volume dimensions
        {% set X_MAX = printer.toolhead.axis_maximum.x|default(100)|float %}
        {% set Y_MAX = printer.toolhead.axis_maximum.y|default(100)|float %}

        #Fix-up extruder
        
        G91                                            
        G1 E-2 F2700                                    
        G1 E-1.5 Z0.2 F2400                        
        G1 X5 Y5 F6000                               
        G1 Z10                                 
        G90                                        
        
        #Present print
        G1 Z{printer.toolhead.position.z + 50} F600
        G1 X5 Y170 F6000
        M106 S0                                      
        M104 S0                                       
        M140 S0 
        SET_LED LED=leds RED=0 GREEN=1 BLUE=0
        WEEZER      
        G1 x90 y90

        #Disable Steppers
        M84 X Y E

#e3v3
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_530029000250414235363020-if00

#e3v2
# [mcu v2]
# serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_32FFD6055646363339680143-if00


[printer]
kinematics: corexy
max_velocity: 700
max_accel: 15000
square_corner_velocity: 5.0
max_z_velocity: 80
max_z_accel: 1000

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>


