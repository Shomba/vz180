[include mainsail.cfg]
[include macros.cfg]
[include buzer.cfg]
[include accel.cfg]
[include leds.cfg]
[include timelapse.cfg]
[include led_progress.cfg]
[include monster_mode.cfg]
#[include silent_mode.cfg]
#[include ebb.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_21004A001750344D30353320-if00

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 15000
square_corner_velocity: 5.0
max_z_velocity: 80
max_z_accel: 1000

[virtual_sdcard]
path: /home/shoomba/printer_data/gcodes

[exclude_object]

[gcode_arcs]
resolution: 1.0

# Template Octopus-only.
# This file is intentionally not active yet because the old backup used
# a second MCU for XY/AWD, and the current Octopus wiring is unknown.
# Fill in the real connectors used on your board before switching to it.

# Driver0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 32
rotation_distance: 40
endstop_pin: PG6
position_endstop: 0
position_max: 180
position_min: 0
homing_speed: 100

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 1.5
stealthchop_threshold: 0
interpolate: false

# Driver1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 32
rotation_distance: 40
endstop_pin: PG9
position_endstop: 0
position_max: 174
position_min: 0
homing_speed: 100

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 1.5
stealthchop_threshold: 0
interpolate: false

# Driver2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 64
rotation_distance: 5.33333
endstop_pin: PG10
position_min: -1
position_max: 270
homing_speed: 30
second_homing_speed: 3
homing_retract_speed: 12

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 1.0
stealthchop_threshold: 0
interpolate: false

# Driver3 - candidate for AWD second motor
[stepper_x1]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200

[tmc2209 stepper_x1]
uart_pin: PC7
run_current: 1.5
stealthchop_threshold: 0
interpolate: false

# Driver4 - candidate for AWD second motor
[stepper_y1]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200

[tmc2209 stepper_y1]
uart_pin: PF2
run_current: 1.5
stealthchop_threshold: 0
interpolate: false

# Driver5 - candidate extruder from previous Octopus section
[extruder]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
gear_ratio: 50:10
microsteps: 64
rotation_distance: 22.856
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 1.4
heater_pin: PA3
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF5
pressure_advance: 0.03
min_extrude_temp: 180
min_temp: 0
max_temp: 290

[tmc2209 extruder]
uart_pin: PE4
run_current: 0.650
stealthchop_threshold: 0

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
min_temp: 0
max_temp: 130

[temperature_sensor MCU]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 100

[temperature_sensor host]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF7
min_temp: -250
max_temp: 100

[temperature_sensor Stepper]
sensor_type: Generic 3950
sensor_pin: PF6
min_temp: -250
max_temp: 120

[fan]
pin: PA8

[controller_fan steppers]
pin: PD15
kick_start_time: 0.2
idle_timeout: 30
max_power: 0.6
off_below: 0.15
stepper: stepper_x, stepper_y, stepper_x1, stepper_y1
