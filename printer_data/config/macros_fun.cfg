[gcode_macro _AUDIO_MODE_ON]
description: Configura motores XY para 2 microsteps sem interpolacao a 1.7A (SpreadCycle) para tocar melodias
gcode:
  {% set orig_ms = printer.configfile.settings['stepper_x'].microsteps|int %}
  {% set scale = (orig_ms / 2.0)|float %}
  {% set scaled_accel = (12000.0 / scale)|round(1) %}
  {% set scaled_scv = (5.0 / scale)|round(3) %}
  M400
  SET_VELOCITY_LIMIT ACCEL={scaled_accel} SQUARE_CORNER_VELOCITY={scaled_scv}
  {% for stp in ['stepper_x', 'stepper_x1', 'stepper_y', 'stepper_y1'] %}
    SET_TMC_CURRENT STEPPER={stp} CURRENT=1.7
    SET_TMC_FIELD STEPPER={stp} FIELD=en_spreadcycle VALUE=1
    SET_TMC_FIELD STEPPER={stp} FIELD=intpol VALUE=0
    SET_TMC_FIELD STEPPER={stp} FIELD=mres VALUE=7
  {% endfor %}

[gcode_macro _AUDIO_MODE_OFF]
description: Restaura microsteps, interpolacao, corrente e aceleracao originais dos motores XY
gcode:
  {% set orig_ms = printer.configfile.settings['stepper_x'].microsteps|int %}
  {% set mres_map = {256: 0, 128: 1, 64: 2, 32: 3, 16: 4, 8: 5, 4: 6, 2: 7, 1: 8} %}
  {% set orig_mres = mres_map.get(orig_ms, 3) %}
  {% set orig_accel = printer.configfile.settings.printer.max_accel|float %}
  {% set orig_scv = printer.configfile.settings.printer.square_corner_velocity|float %}
  M400
  {% for stp in ['stepper_x', 'stepper_x1', 'stepper_y', 'stepper_y1'] %}
    {% set cfg = printer.configfile.settings['tmc2209 ' ~ stp] %}
    {% set orig_intpol = 1 if cfg.interpolate else 0 %}
    SET_TMC_FIELD STEPPER={stp} FIELD=mres VALUE={orig_mres}
    SET_TMC_FIELD STEPPER={stp} FIELD=intpol VALUE={orig_intpol}
    SET_TMC_CURRENT STEPPER={stp} CURRENT={cfg.run_current}
  {% endfor %}
  SET_VELOCITY_LIMIT ACCEL={orig_accel} SQUARE_CORNER_VELOCITY={orig_scv}

[gcode_macro _AUDIO_MODE_Z_ON]
description: Configura motor Z para 4 microsteps sem interpolacao a 1.2A (limite seguro TMC2208, SpreadCycle)
gcode:
  {% set orig_ms_z = printer.configfile.settings['stepper_z'].microsteps|int %}
  {% set scale_z = (orig_ms_z / 4.0)|float %}
  {% set max_z_accel = printer.configfile.settings.printer.max_z_accel|float %}
  {% set scaled_z_accel = (max_z_accel / scale_z)|round(1) %}
  M400
  SET_VELOCITY_LIMIT ACCEL={scaled_z_accel}
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT=1.2
  SET_TMC_FIELD STEPPER=stepper_z FIELD=en_spreadcycle VALUE=1
  SET_TMC_FIELD STEPPER=stepper_z FIELD=intpol VALUE=0
  SET_TMC_FIELD STEPPER=stepper_z FIELD=mres VALUE=6

[gcode_macro _AUDIO_MODE_Z_OFF]
description: Restaura microsteps, interpolacao, corrente e aceleracao originais do motor Z
gcode:
  {% set orig_ms_z = printer.configfile.settings['stepper_z'].microsteps|int %}
  {% set mres_map = {256: 0, 128: 1, 64: 2, 32: 3, 16: 4, 8: 5, 4: 6, 2: 7, 1: 8} %}
  {% set orig_mres_z = mres_map.get(orig_ms_z, 3) %}
  {% set cfg = printer.configfile.settings['tmc2208 stepper_z'] %}
  {% set orig_intpol = 1 if cfg.interpolate else 0 %}
  {% set orig_accel = printer.configfile.settings.printer.max_accel|float %}
  M400
  SET_TMC_FIELD STEPPER=stepper_z FIELD=mres VALUE={orig_mres_z}
  SET_TMC_FIELD STEPPER=stepper_z FIELD=intpol VALUE={orig_intpol}
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={cfg.run_current}
  SET_VELOCITY_LIMIT ACCEL={orig_accel}

[gcode_macro BAMBU_START]
description: Toque de inicio da Bambu Lab A1 (2 microsteps, sem interpolacao, 1.7A, polifonia CoreXY)
gcode:
