# steppers
[stepper_x]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 32
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 180
position_min: 0
homing_speed: 100

[stepper_x1]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200



[stepper_y]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 32
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 174
position_min: 0
homing_speed: 100

[stepper_y1]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200

# drivers

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.5
stealthchop_threshold: 0
interpolate: false

[tmc2209 stepper_x1]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 1.5
stealthchop_threshold: 0
interpolate: false

driver_SGTHRS: 255

[gcode_button X1_diag]
pin: ^PC2
press_gcode:
  M106 S255
release_gcode:


[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 1.5
stealthchop_threshold: 0
interpolate: false

[tmc2209 stepper_y1]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 1.5
stealthchop_threshold: 0
interpolate: false

#fans

[controller_fan steppers]
pin: v2:PC6
kick_start_time: 0.2
idle_timeout:30
max_power: 0.6
off_below:0.15
stepper: stepper_x, stepper_y,stepper_x1, stepper_y1


