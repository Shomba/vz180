[gcode_macro enable_stepper]
description: Habilita os motores XY AWD
gcode:
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=1
  SET_STEPPER_ENABLE STEPPER=stepper_x1 ENABLE=1
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=1
  SET_STEPPER_ENABLE STEPPER=stepper_y1 ENABLE=1

[gcode_macro POSICIONAR_WIPER]
description: Abre janela interativa no Mainsail para ajustar e salvar a posicao XY/Z do wiper
gcode:
  {% set saved = printer.save_variables.variables %}
  {% set wx = params.X|default(saved.wiper_x|default(153.5))|float|round(2) %}
  {% set wy = params.Y|default(saved.wiper_y|default(12.0))|float|round(2) %}
  {% set wz = params.Z|default(saved.wiper_z|default(1.0))|float|round(2) %}

  {% if "xyz" not in printer.toolhead.homed_axes %}
    RESPOND MSG="Fazendo home dos eixos..."
    G28
  {% endif %}

  G90
  G1 Z10 F3000
  G1 X{wx} Y{wy} F6000
  G1 Z{wz} F1200

  _WIPER_PROMPT X={wx} Y={wy} Z={wz}

[gcode_macro _WIPER_PROMPT]
variable_wx: 153.5
variable_wy: 12.0
variable_wz: 1.0
gcode:
  {% set wx = params.X|default(printer["gcode_macro _WIPER_PROMPT"].wx)|float|round(2) %}
  {% set wy = params.Y|default(printer["gcode_macro _WIPER_PROMPT"].wy)|float|round(2) %}
  {% set wz = params.Z|default(printer["gcode_macro _WIPER_PROMPT"].wz)|float|round(2) %}
  SET_GCODE_VARIABLE MACRO=_WIPER_PROMPT VARIABLE=wx VALUE={wx}
  SET_GCODE_VARIABLE MACRO=_WIPER_PROMPT VARIABLE=wy VALUE={wy}
  SET_GCODE_VARIABLE MACRO=_WIPER_PROMPT VARIABLE=wz VALUE={wz}

  RESPOND TYPE=command MSG="action:prompt_begin Posicionar Wiper"
  RESPOND TYPE=command MSG="action:prompt_text Posicao atual: X={wx} | Y={wy} | Z={wz} mm"
  RESPOND TYPE=command MSG="action:prompt_text Area de varredura do WIPE: X+20 mm, Y+2.5 mm"

  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button X -5|_WIPER_JOG DX=-5|secondary"
  RESPOND TYPE=command MSG="action:prompt_button X -1|_WIPER_JOG DX=-1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button X -0.5|_WIPER_JOG DX=-0.5|secondary"
  RESPOND TYPE=command MSG="action:prompt_button X +0.5|_WIPER_JOG DX=0.5|secondary"
  RESPOND TYPE=command MSG="action:prompt_button X +1|_WIPER_JOG DX=1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button X +5|_WIPER_JOG DX=5|secondary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"

  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Y -5|_WIPER_JOG DY=-5|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Y -1|_WIPER_JOG DY=-1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Y -0.5|_WIPER_JOG DY=-0.5|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Y +0.5|_WIPER_JOG DY=0.5|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Y +1|_WIPER_JOG DY=1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Y +5|_WIPER_JOG DY=5|secondary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"

  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Z -1|_WIPER_JOG DZ=-1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Z -0.2|_WIPER_JOG DZ=-0.2|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Z +0.2|_WIPER_JOG DZ=0.2|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Z +1|_WIPER_JOG DZ=1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"

  RESPOND TYPE=command MSG="action:prompt_button Testar Contorno|_WIPER_TEST_CONTORNO|info"

  RESPOND TYPE=command MSG="action:prompt_footer_button Salvar|_WIPER_SAVE|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancelar|_WIPER_CLOSE|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WIPER_JOG]
gcode:
  {% set cur = printer["gcode_macro _WIPER_PROMPT"] %}
  {% set dx = params.DX|default(0.0)|float %}
  {% set dy = params.DY|default(0.0)|float %}
  {% set dz = params.DZ|default(0.0)|float %}
  {% set max_x = printer.toolhead.axis_maximum.x|float %}
  {% set max_y = printer.toolhead.axis_maximum.y|float %}

  {% set nx = [[cur.wx + dx, 0.0]|max, max_x]|min|round(2) %}
  {% set ny = [[cur.wy + dy, 0.0]|max, max_y]|min|round(2) %}
  {% set nz = [[cur.wz + dz, 0.0]|max, 50.0]|min|round(2) %}

  G90
  G1 X{nx} Y{ny} Z{nz} F1800
  _WIPER_PROMPT X={nx} Y={ny} Z={nz}

[gcode_macro _WIPER_TEST_CONTORNO]
gcode:
  {% set cur = printer["gcode_macro _WIPER_PROMPT"] %}
  {% set wx = cur.wx|float %}
  {% set wy = cur.wy|float %}
  {% set wz = cur.wz|float %}
  {% set x_end = [wx + 20.0, printer.toolhead.axis_maximum.x|float]|min|round(2) %}
  {% set y_end = [wy + 2.5, printer.toolhead.axis_maximum.y|float]|min|round(2) %}

  G90
  G1 X{wx} Y{wy} Z{wz} F1800
  G1 X{x_end} Y{wy} F1800
  G4 P300
  G1 X{x_end} Y{y_end} F1800
  G4 P300
  G1 X{wx} Y{y_end} F1800
  G4 P300
  G1 X{wx} Y{wy} F1800
  _WIPER_PROMPT X={wx} Y={wy} Z={wz}

[gcode_macro _WIPER_SAVE]
gcode:
  {% set cur = printer["gcode_macro _WIPER_PROMPT"] %}
  SAVE_VARIABLE VARIABLE=wiper_x VALUE={cur.wx|round(2)}
  SAVE_VARIABLE VARIABLE=wiper_y VALUE={cur.wy|round(2)}
  SAVE_VARIABLE VARIABLE=wiper_z VALUE={cur.wz|round(2)}
  RESPOND TYPE=command MSG="action:prompt_end"
  G90
  G1 Z10 F3000
  RESPOND MSG="Posicao do wiper salva: X={cur.wx|round(2)} Y={cur.wy|round(2)} Z={cur.wz|round(2)}"

[gcode_macro _WIPER_CLOSE]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  G90
  G1 Z10 F3000
  RESPOND MSG="Ajuste do wiper encerrado sem salvar."
