[gcode_macro enable_stepper]
description: Habilita os motores XY AWD
gcode:
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=1
  SET_STEPPER_ENABLE STEPPER=stepper_x1 ENABLE=1
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=1
  SET_STEPPER_ENABLE STEPPER=stepper_y1 ENABLE=1

[gcode_macro POSICIONAR_WIPER]
description: Move o bico para a posicao do wiper para alinhamento. CONTORNO=1 percorre toda a area de varredura.
gcode:
  {% set wiper_x = params.X|default(153.5)|float %}
  {% set wiper_y = params.Y|default(12.0)|float %}
  {% set wiper_z = params.Z|default(1.0)|float %}
  {% set largura = params.LARGURA|default(20.0)|float %}
  {% set profundidade = params.PROFUNDIDADE|default(2.5)|float %}
  {% set contorno = params.CONTORNO|default(0)|int %}

  {% if "xyz" not in printer.toolhead.homed_axes %}
    RESPOND MSG="Fazendo home dos eixos..."
    G28
  {% endif %}

  G90
  G1 Z10 F3000
  G1 X{wiper_x} Y{wiper_y} F6000
  G1 Z{wiper_z} F1200

  RESPOND MSG="Bico posicionado no inicio do wiper: X={wiper_x} Y={wiper_y} Z={wiper_z} (varredura: X {wiper_x}..{wiper_x + largura}, Y {wiper_y}..{wiper_y + profundidade})"

  {% if contorno == 1 %}
    RESPOND MSG="Percorrendo contorno da area do wiper..."
    G1 X{wiper_x + largura} Y{wiper_y} F1800
    G4 P500
    G1 X{wiper_x + largura} Y{wiper_y + profundidade} F1800
    G4 P500
    G1 X{wiper_x} Y{wiper_y + profundidade} F1800
    G4 P500
    G1 X{wiper_x} Y{wiper_y} F1800
    RESPOND MSG="Contorno do wiper concluido."
  {% endif %}
