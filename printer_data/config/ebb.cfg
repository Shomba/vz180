# Btt Ebb36 V1.2
[mcu ebb]
canbus_uuid: 84e4abc14b6e

[adxl345]
cs_pin: ebb:PB12
#spi_bus: spi1
spi_software_mosi_pin: ebb:PB11 # Software SPI. Choose either hardware SPI or software SPI. Default is hardware SPI.
spi_software_miso_pin: ebb:PB2
spi_software_sclk_pin: ebb:PB10
#spi_speed: 00000
axes_map: x, z, -y

[resonance_tester]
accel_chip: adxl345
probe_points:
    89,87,20 # Centro da cama da VZ180 (180x174)

[temperature_sensor ebb]
sensor_type: temperature_mcu
sensor_mcu: ebb
min_temp: -273.15
max_temp: 150