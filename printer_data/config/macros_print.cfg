[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: False
variable_custom_park_x: 10.0
variable_custom_park_y: 10.0
variable_custom_park_dz: 10.0
variable_retract: 1.0
variable_cancel_retract: 5.0
variable_speed_retract: 35.0
variable_unretract: 1.0
variable_speed_unretract: 35.0
variable_speed_hop: 15.0
variable_speed_move: 100.0
variable_park_at_cancel: True
variable_park_at_cancel_x: 10.0
variable_park_at_cancel_y: 10.0
variable_use_fw_retract: False
variable_idle_timeout: 0
variable_runout_sensor: ""
gcode:

[gcode_macro HEAT_CHAMBER]
description: Aquecimento ativo/passivo da câmara usando a cama aquecida e recirculação de ar
gcode:
  {% set TARGET = params.TARGET|default(40)|float %}
  {% set BED_TEMP = params.BED|default(100)|float %}
  {% set FAN = params.FAN_SPEED|default(0.2)|float %}

  RESPOND MSG="🔥 Aquecendo câmara até {TARGET}°C (Cama: {BED_TEMP}°C)..."
  M140 S{BED_TEMP}
  M106 S{(FAN * 255)|int}

  {% if "xyz" in printer.toolhead.homed_axes %}
    G90
    G1 X90 Y87 Z30 F6000
  {% endif %}

  TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={TARGET}
  RESPOND MSG="✅ Câmara atingiu {TARGET}°C!"

[gcode_macro M141]
description: Suporte ao comando de câmara do fatiador (OrcaSlicer/PrusaSlicer)
gcode:
  {% set S = params.S|default(0)|float %}
  {% if S > 0 %}
    HEAT_CHAMBER TARGET={S}
  {% endif %}

[gcode_macro HANDLE_STEPPER_OVERHEAT]
description: Protocolo de resfriamento de emergência por sinal de hardware OTPW/OT dos drivers TMC
gcode:
  {% set DRIVER = params.DRIVER|default("TMC") %}
  {% if printer.print_stats.state == "printing" %}
    RESPOND TYPE=error MSG="⚠️ ALERTA TMC: Driver {DRIVER} reportou superaquecimento (hardware OTPW)! Pausando impressão e iniciando resfriamento de 5 minutos..."
    
    # 1. Pausa a impressão
    PAUSE
    
    # 2. Sobe o eixo Z em 5mm
    G91
    G1 Z5 F1200
    G90
    
    # 3. Desliga os motores dos eixos XY e Extrusor
    M84 X Y E
    
    # 4. Aguarda 5 minutos (300.000 ms) para resfriamento
    RESPOND MSG="❄️ Motores desligados. Aguardando 5 minutos (300s) para resfriamento dos drivers TMC..."
    G4 P300000
    
    # 5. Liga os motores novamente
    RESPOND MSG="⚡ Re-habilitando motores dos eixos XY e extrusor..."
    enable_stepper
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1
    
    # 6. Faz o home dos eixos X e Y
    RESPOND MSG="🏠 Fazendo Home dos eixos X e Y..."
    G28 X Y
    
    # 7. Retoma a impressão
    RESPOND MSG="▶️ Drivers TMC resfriados com sucesso! Retomando a impressão..."
    RESUME
  {% else %}
    RESPOND TYPE=error MSG="⚠️ Sinal de superaquecimento no driver {DRIVER} detectado em modo ocioso! Desligando motores X Y E."
    M84 X Y E
  {% endif %}

[delayed_gcode CHECK_SENSORS]
initial_duration: 5.0
gcode:
  {% set chamber_temp = printer["temperature_sensor chamber"].temperature|default(0)|float %}
  {% set mcu_temp = printer["temperature_sensor MCU"].temperature|default(0)|float %}
  {% set host_temp = printer["temperature_sensor host"].temperature|default(0)|float %}

  # Verificação contínua do sinal de hardware OTPW/OT dos drivers TMC
  {% set tmc_drivers = ['tmc2209 stepper_x', 'tmc2209 stepper_x1', 'tmc2209 stepper_y', 'tmc2209 stepper_y1', 'tmc2208 stepper_z', 'tmc2208 extruder'] %}
  {% set ns = namespace(overheat=False, driver="") %}

  {% for drv in tmc_drivers %}
    {% if printer[drv] is defined and printer[drv].drv_status is defined and printer[drv].drv_status %}
      {% set ds = printer[drv].drv_status %}
      {% if ds.get('otpw', 0) or ds.get('ot', 0) or ds.get('over_temperature_pre_warning', 0) or ds.get('over_temperature', 0) %}
        {% set ns.overheat = True %}
        {% set ns.driver = drv %}
      {% endif %}
    {% endif %}
  {% endfor %}

  {% if ns.overheat %}
    HANDLE_STEPPER_OVERHEAT DRIVER="{ns.driver}"
  {% endif %}

  {% if chamber_temp < -10 or chamber_temp > 90 %}
    RESPOND TYPE=error MSG="⚠️ ALERTA SENSOR: Leitura anormal na câmara ({chamber_temp}°C). Verifique o sensor/fiação."
  {% endif %}

  {% if mcu_temp > 80 %}
    RESPOND TYPE=error MSG="⚠️ ALERTA SENSOR: Temperatura da MCU alta ({mcu_temp}°C)!"
  {% endif %}

  {% if host_temp > 80 %}
    RESPOND TYPE=error MSG="⚠️ ALERTA SENSOR: Temperatura do Host alta ({host_temp}°C)!"
  {% endif %}

  UPDATE_DELAYED_GCODE ID=CHECK_SENSORS DURATION=10.0

[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: _SET_PRINT_STATS_INFO_BASE
gcode:
  _SET_PRINT_STATS_INFO_BASE {rawparams}
  {% if printer.print_stats.state == "printing" %}
    LOG_Z
  {% endif %}

[gcode_macro START_PRINT]
description: Sequencia de inicio
gcode:
  {% set X_MAX = printer.toolhead.axis_maximum.x|default(100)|float %}
  {% set Y_MAX = printer.toolhead.axis_maximum.y|default(100)|float %}
  {% set Z_MAX = printer.toolhead.axis_maximum.z|default(100)|float %}
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
  {% set PURGE_PASSES = params.PASSES|default(2)|int %}

  G90
  M83
  G92 E0

  G31
  save_last_file
  SAVE_VARIABLE VARIABLE=was_interrupted VALUE=True

  M140 S{BED_TEMP}
  M104 S150
  G28

  {% if CHAMBER_TEMP > 0 %}
    HEAT_CHAMBER TARGET={CHAMBER_TEMP} BED={BED_TEMP}
  {% endif %}

  G1 Y{Y_MAX - 30} Z{[Z_MAX / 7.0, 15.0]|min} F8000
  M190 S{BED_TEMP}
  PURGE PREHEAT={EXTRUDER_TEMP} PASSES={PURGE_PASSES}
  G92 E0
  LOG_Z

[gcode_macro M600]
description: Troca de filamento
gcode:
  PAUSE X=10 Y=10 Z_MIN=50

[gcode_macro END_PRINT]
description: Sequencia de fim
gcode:
  {% set X_SAFE = 5 %}
  {% set Y_SAFE = printer.toolhead.axis_maximum.y|float - 4.0 %}
  {% set Z_NOW = printer.toolhead.position.z|float %}
  {% set Z_MAX = printer.toolhead.axis_maximum.z|float %}
  {% set Z_PARK = [Z_NOW + 20.0, Z_MAX]|min %}

  SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
  clear_last_file
  G31

  M400
  G92 E0
  G91
  G1 E-2 F2700
  G1 Z2 F1200
  G90
  G1 Z{Z_PARK} F1200
  G1 X{X_SAFE} Y{Y_SAFE} F6000
  M106 S0
  TURN_OFF_HEATERS
  G92 E0
  WEEZER
  M84 X Y E

[gcode_macro PURGE]
description: Purge + wiper. PREHEAT define temperatura final. PASSES define limpeza.
gcode:
  {% set final_temp = params.PREHEAT|default(0)|int %}
  {% set wipe_passes = params.PASSES|default(3)|int %}
  {% set initial_preheat = 185 %}
  {% set purge_x = 137.5 %}
  {% set purge_y = 2.5 %}
  {% set purge_amount = 90 %}
  {% set purge_feed = 600 %}
  {% set retract = 5.0 %}
  {% set extruder = printer[printer.toolhead.extruder] %}
  {% set current_temp = extruder.temperature %}

  {% if current_temp < initial_preheat %}
    M104 S{initial_preheat}
  {% endif %}

  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

  {% if final_temp > 0 %}
    M109 S{final_temp}
  {% endif %}

  G90
  G1 Z5 F3000
  G1 X{purge_x} Y{purge_y} F6000
  G1 Z0.8 F1200

  G92 E0
  G91
  G1 E-{retract} F400
  G1 E{purge_amount/2} F{purge_feed}
  G92 E0
  G1 E{purge_amount/2} F{purge_feed}
  G4 P250
  G1 E-0.2 F200
  G90
  G92 E0
  WIPE PASSES={wipe_passes}
  G90
  G1 Z5 F800
  G92 E0

[gcode_macro WIPE]
description: Wiper. PASSES define limpeza.
gcode:
  {% set wipe_passes = params.PASSES|default(3)|int %}
  {% set wiper_x = 153.5 %}
  {% set wiper_y = 6.0 %}
  {% set wipe_z = 1.0 %}
  {% set zig_steps = 4 %}
  {% set zig_move = 2.5 %}

  G90
  G1 Z2
  G1 X{wiper_x} Y{wiper_y} F2400
  G1 Z{wipe_z} F1200
  G91

  {% for p in range(wipe_passes) %}
    {% for c in range(3) %}
      G1 X20 F10000
      G1 Y2.5
      G1 X-20
      G1 Y-2.5
    {% endfor %}

    {% for i in range(zig_steps) %}
      G1 X{zig_move}
      G1 Y2.5
      G1 X{zig_move}
      G1 Y-2.5
    {% endfor %}

    {% for i in range(zig_steps) %}
      G1 X-{zig_move}
      G1 Y-2.5
      G1 X-{zig_move}
      G1 Y2.5
    {% endfor %}
  {% endfor %}

  G1 Z0.4 F1200
